<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SupriAI Backend Connection Test</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .container {
        background: white;
        border-radius: 20px;
        padding: 40px;
        max-width: 600px;
        width: 100%;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }
      h1 {
        color: #333;
        margin-bottom: 30px;
        text-align: center;
      }
      .test-section {
        margin-bottom: 25px;
        padding: 20px;
        background: #f8f9fa;
        border-radius: 10px;
        border-left: 4px solid #667eea;
      }
      .test-title {
        font-weight: 600;
        color: #667eea;
        margin-bottom: 10px;
        font-size: 1.1rem;
      }
      .result {
        padding: 15px;
        border-radius: 8px;
        margin-top: 10px;
        font-family: "Courier New", monospace;
        font-size: 0.9rem;
      }
      .success {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }
      .error {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }
      .loading {
        background: #fff3cd;
        color: #856404;
        border: 1px solid #ffeaa7;
      }
      button {
        background: #667eea;
        color: white;
        border: none;
        padding: 12px 30px;
        border-radius: 8px;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s;
        width: 100%;
        margin-top: 20px;
      }
      button:hover {
        background: #5568d3;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
      }
      .status-indicator {
        display: inline-block;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        margin-right: 8px;
      }
      .online {
        background: #28a745;
        box-shadow: 0 0 10px #28a745;
      }
      .offline {
        background: #dc3545;
        box-shadow: 0 0 10px #dc3545;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🧠 SupriAI Backend Connection Test</h1>

      <div class="test-section">
        <div class="test-title">1. Health Check</div>
        <div id="healthResult" class="result loading">Testing...</div>
      </div>

      <div class="test-section">
        <div class="test-title">2. Analytics Summary</div>
        <div id="analyticsResult" class="result loading">Testing...</div>
      </div>

      <div class="test-section">
        <div class="test-title">3. History Fetch</div>
        <div id="historyResult" class="result loading">Testing...</div>
      </div>

      <div class="test-section">
        <div class="test-title">4. Bookmarks</div>
        <div id="bookmarksResult" class="result loading">Testing...</div>
      </div>

      <div class="test-section">
        <div class="test-title">5. Notes</div>
        <div id="notesResult" class="result loading">Testing...</div>
      </div>

      <div class="test-section">
        <div class="test-title">6. Goals</div>
        <div id="goalsResult" class="result loading">Testing...</div>
      </div>

      <button onclick="runAllTests()">🔄 Run All Tests Again</button>
    </div>

    <script>
      const API_URL = "http://127.0.0.1:8000";

      async function testEndpoint(name, url, elementId) {
        const element = document.getElementById(elementId);
        element.className = "result loading";
        element.innerHTML = "⏳ Testing...";

        try {
          const response = await fetch(url);
          const data = await response.json();

          if (response.ok) {
            element.className = "result success";
            element.innerHTML =
              `✅ SUCCESS (${response.status})<br>` +
              `Response: ${JSON.stringify(data, null, 2)}`;
          } else {
            element.className = "result error";
            element.innerHTML =
              `❌ FAILED (${response.status})<br>` +
              `Error: ${JSON.stringify(data, null, 2)}`;
          }
        } catch (error) {
          element.className = "result error";
          element.innerHTML =
            `❌ CONNECTION ERROR<br>` +
            `Message: ${error.message}<br>` +
            `This usually means the backend server is not running.`;
        }
      }

      async function runAllTests() {
        console.log("🚀 Starting backend connection tests...");

        // Test 1: Health Check
        await testEndpoint(
          "Health Check",
          `${API_URL}/api/health`,
          "healthResult",
        );

        // Test 2: Analytics Summary
        await testEndpoint(
          "Analytics",
          `${API_URL}/api/analytics/summary`,
          "analyticsResult",
        );

        // Test 3: History
        await testEndpoint(
          "History",
          `${API_URL}/api/history?limit=5`,
          "historyResult",
        );

        // Test 4: Bookmarks
        await testEndpoint(
          "Bookmarks",
          `${API_URL}/api/bookmarks`,
          "bookmarksResult",
        );

        // Test 5: Notes
        await testEndpoint("Notes", `${API_URL}/api/notes`, "notesResult");

        // Test 6: Goals
        await testEndpoint("Goals", `${API_URL}/api/goals`, "goalsResult");

        console.log("✅ All tests completed!");
      }

      // Run tests on page load
      window.addEventListener("DOMContentLoaded", runAllTests);
    </script>
  </body>
</html>
