<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>AI Companion</title>
    <!-- Fonts: Google Sans (Local) -->
    <style>
        @font-face {
            font-family: 'Google Sans';
            font-style: normal;
            font-weight: 400;
            src: url('../assets/libs/fonts/GoogleSans-Regular.woff2') format('woff2');
        }

        @font-face {
            font-family: 'Google Sans';
            font-style: normal;
            font-weight: 500;
            src: url('../assets/libs/fonts/GoogleSans-Medium.woff2') format('woff2');
        }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        /* Light Material Popup Theme */
        :root {
            --primary: #1a73e8;
            --bg: #ffffff;
            --text-main: #202124;
            --text-sub: #5f6368;
            --divider: #e8eaed;
            --hover: #f1f3f4;
            --font-family: 'Google Sans', sans-serif;
        }

        body {
            width: 340px;
            font-family: var(--font-family);
            margin: 0;
            padding: 16px;
            background: var(--bg);
            color: var(--text-main);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            font-size: 1.1rem;
            color: var(--text-main);
        }

        .logo i {
            color: var(--primary);
            font-size: 1.4rem;
        }

        .status-pill {
            background: #e6f4ea;
            color: #1e8e3e;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-pill.paused {
            background: #fce8e6;
            color: #d93025;
        }

        /* Central Card */
        .focus-card {
            background: #ffffff;
            border: 1px solid var(--divider);
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            box-shadow: 0 1px 2px 0 rgba(60, 64, 67, 0.1), 0 1px 3px 1px rgba(60, 64, 67, 0.05);
            margin-bottom: 20px;
            position: relative;
        }

        .topic-icon {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 8px;
            opacity: 0.1;
            /* Placeholder until active */
        }

        .topic-title {
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .timer-display {
            font-size: 2.5rem;
            font-weight: 300;
            color: var(--text-main);
            margin: 10px 0;
            font-feature-settings: "tnum";
            font-variant-numeric: tabular-nums;
        }

        .confidence-bar {
            height: 4px;
            background: #f1f3f4;
            border-radius: 2px;
            margin: 8px auto;
            width: 60%;
            overflow: hidden;
        }

        .confidence-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.5s;
        }

        /* Stats Row */
        .stats-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 0 8px;
        }

        .stat {
            text-align: center;
        }

        .stat-val {
            font-size: 1.1rem;
            font-weight: 500;
        }

        .stat-lbl {
            font-size: 0.75rem;
            color: var(--text-sub);
            text-transform: uppercase;
        }

        /* Controls */
        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        button {
            border: 1px solid var(--divider);
            background: white;
            padding: 10px;
            border-radius: 4px;
            color: var(--primary);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover {
            background: var(--hover);
        }

        .primary-btn {
            background: var(--primary);
            color: white;
            border: none;
        }

        .primary-btn:hover {
            background: #1557b0;
            box-shadow: 0 1px 3px 1px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="logo">
            <i class="ri-brain-fill"></i> SupriAI
        </div>
        <div class="status-pill" id="statusBadge">
            <span class="dot" style="width:6px;height:6px;background:currentColor;border-radius:50%"></span> Active
        </div>
    </div>

    <div class="focus-card">
        <i class="ri-search-eye-line topic-icon"></i>
        <div class="topic-title" id="currentTopic">Browsing...</div>
        <div class="confidence-bar">
            <div class="confidence-fill" id="confFill"></div>
        </div>

        <div class="timer-display" id="sessionTime">00:00</div>
        <div style="font-size: 0.8rem; color: var(--text-sub);">Current Session</div>
    </div>

    <div class="stats-row">
        <div class="stat">
            <div class="stat-val" id="todayTime">12m</div>
            <div class="stat-lbl">Today</div>
        </div>
        <div class="stat">
            <div class="stat-val" id="streakBadge">3</div>
            <div class="stat-lbl">Streak</div>
        </div>
        <div class="stat">
            <div class="stat-val">High</div>
            <div class="stat-lbl">Focus</div>
        </div>
    </div>

    <div class="actions">
        <button id="toggleTracking">
            <i class="ri-pause-circle-line"></i> Pause
        </button>
        <button class="primary-btn" id="openDashboard">
            Dashboard <i class="ri-arrow-right-line"></i>
        </button>
    </div>

    <script src="../assets/js/popup.js"></script>
</body>

</html>
